name: Bluesky replies (spread through the day)

on:
  schedule:
    # 7 runs every 2h across the active day (03:00-15:00 UTC = 08:30-20:30 IST),
    # so replies trickle out steadily all day. Each run schedules up to PER_RUN
    # replies (derived from the daily cap / 7) a few minutes apart; the daily cap
    # (dailyCap(): ramps 24 -> 35 -> 50) stops later runs once it's reached.
    - cron: "0 3,5,7,9,11,13,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draft + print, schedule nothing"
        type: boolean
        default: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code (for drafting)
        run: npm install -g @anthropic-ai/claude-code

      - name: Draft + schedule replies
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node .github/scripts/bluesky-replies.mjs
