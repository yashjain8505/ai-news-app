name: Daily Bluesky post

on:
  # Schedule DISABLED: this is the old single-post auto-poster, superseded by the
  # bluesky-prepare / bluesky-replies / drip system (text-first posts + replies).
  # Kept manual-only to save Actions minutes and avoid redundant posts.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + print the post, send nothing"
        type: boolean
        default: false
      force:
        description: "Post even if this edition was already posted"
        type: boolean
        default: false
      edition_date:
        description: "Post a specific edition (YYYY-MM-DD); blank = latest"
        type: string
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Post the daily Bluesky update
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_URL: https://www.wortins.com
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: node .github/scripts/post-bluesky.mjs
