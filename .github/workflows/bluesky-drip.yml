name: Bluesky drip

# Pokes /api/bluesky/drip so due scheduled posts/replies go out.
#
# NOTE: the schedule is intentionally OFF here. A GitHub */20 cron looks cheap
# (just a curl) but GitHub bills a 1-minute MINIMUM per job, so 72 runs/day =
# ~2,160 Actions minutes/month, which alone exceeds the free budget. Instead,
# an external free cron (cron-job.org) POSTs the endpoint every ~20 min with the
# `Authorization: Bearer <BLUESKY_REVIEW_SECRET>` header. Zero Actions minutes.
# This workflow_dispatch entry is kept only for manual/testing pokes.
on:
  workflow_dispatch:

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poke the drip endpoint
        run: |
          code=$(curl -s -o /tmp/drip.txt -w "%{http_code}" -X POST \
            "https://www.wortins.com/api/bluesky/drip" \
            -H "Authorization: Bearer ${{ secrets.BLUESKY_REVIEW_SECRET }}")
          echo "HTTP $code"; cat /tmp/drip.txt || true
          if [ "$code" != "200" ]; then echo "drip endpoint returned $code"; exit 1; fi
