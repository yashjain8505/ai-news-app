name: Daily Substack note

on:
  schedule:
    # 14:00 UTC = 19:30 IST = 09:00 ET — prime US-morning window for Substack
    # Notes reach, and by now all of the day's edition drops (01:30/06:30/11:30
    # UTC) have landed, so the note carries fresh stories. Idempotent per
    # edition_date (substack_notes ledger), so a re-run never double-posts.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + print the note, post nothing"
        type: boolean
        default: false
      force:
        description: "Post even if this edition was already posted"
        type: boolean
        default: false
      edition_date:
        description: "Post a specific edition (YYYY-MM-DD); blank = latest"
        type: string
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Post the daily Substack note
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUBSTACK_COOKIE: ${{ secrets.SUBSTACK_COOKIE }}
          SITE_URL: https://www.wortins.com
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: node .github/scripts/post-substack-note.mjs
