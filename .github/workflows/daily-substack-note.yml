name: Daily Substack note

on:
  # Schedule DISABLED: Substack sits behind Cloudflare bot protection, which
  # blocks automated posts from a datacenter IP (GitHub Actions) with a 403
  # "Just a moment" challenge, even with a full browser fingerprint + a valid
  # login cookie. So a scheduled run just fails daily. Kept as manual-only
  # (workflow_dispatch) for testing; real auto-distribution should use a channel
  # with an official API (e.g. Bluesky) instead.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + print the note, post nothing"
        type: boolean
        default: false
      force:
        description: "Post even if this edition was already posted"
        type: boolean
        default: false
      edition_date:
        description: "Post a specific edition (YYYY-MM-DD); blank = latest"
        type: string
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Post the daily Substack note
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUBSTACK_COOKIE: ${{ secrets.SUBSTACK_COOKIE }}
          SITE_URL: https://www.wortins.com
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: node .github/scripts/post-substack-note.mjs
