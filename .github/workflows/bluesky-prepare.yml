name: Bluesky review packet (3x/day)

on:
  # Schedule DISABLED 2026-09-10: Bluesky POSTS now go out through Typefully
  # alongside Substack, X and LinkedIn, on the same 11:00/15:00/19:00 IST queue
  # and from the same three-story drafting pass. This pipeline also depended on
  # the drip endpoint, which had been cancelling most rows as stale.
  #
  # bluesky-replies.yml is deliberately UNTOUCHED: Typefully cannot reply to
  # someone else's post or follow anyone, and replies + follows are what
  # actually grew this account.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draft + print, write/email nothing"
        type: boolean
        default: false
      force:
        description: "Re-prepare even if this slot already exists"
        type: boolean
        default: false
      slot:
        description: "morning | afternoon | evening (blank = derive from time)"
        type: string
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code (for drafting)
        run: npm install -g @anthropic-ai/claude-code

      - name: Prepare the Bluesky review packet
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_URL: https://www.wortins.com
          BLUESKY_REVIEW_SECRET: ${{ secrets.BLUESKY_REVIEW_SECRET }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          MAIL_TO: earanyash@gmail.com
          SLOT: ${{ github.event.inputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: node .github/scripts/bluesky-prepare.mjs
