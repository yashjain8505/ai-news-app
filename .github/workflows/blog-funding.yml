name: Blog — funding posts

# Turns AI funding rounds the curator has already captured (the `funding` section)
# into full per-company blog deep-dives, and opens a PR for review — so the /blog
# corpus grows automatically instead of by hand. PR-mode: nothing goes live until
# a human merges. Runs on a schedule (below) and on demand.
concurrency:
  group: blog-funding
  cancel-in-progress: false

on:
  # Auto-run twice a week, off the daily curator's slots. GitHub's scheduler can
  # occasionally drop a run — low-stakes here (a miss just defers posts to the
  # next run). Point cron-job.org at this workflow if you want guaranteed timing.
  schedule:
    - cron: "0 20 * * 1,4" # Mon & Thu 20:00 UTC (01:30 IST Tue/Fri)
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Max new posts to draft this run"
        type: string
        default: "5"
      write_model:
        description: "Model for the writing pass (sonnet is plenty; opus for max quality)"
        type: string
        default: "sonnet"

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # PASS 1 — Haiku RESEARCHES: reads the curated funding items, finds the ones
      # with no blog post yet, web-enriches each, writes /tmp/blog-candidates.json.
      - name: Gather funding candidates (Haiku)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '5' }}
        run: |
          claude -p "$(cat .github/scripts/blog-funding-gather-prompt.md)" \
            --model haiku \
            --output-format json \
            --dangerously-skip-permissions \
            --max-turns 80 | tee /tmp/gather_out.json >/dev/null
          echo "===== GATHER (Haiku) USAGE ====="
          jq -r '"input=\(.usage.input_tokens // 0) output=\(.usage.output_tokens // 0) cost_usd=\(.total_cost_usd // 0) turns=\(.num_turns // 0)"' /tmp/gather_out.json 2>/dev/null || echo "(usage not parseable)"

      - name: Count candidates
        id: count
        run: |
          n=$(jq 'length' /tmp/blog-candidates.json 2>/dev/null || echo 0)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "candidates: $n"

      # PASS 2 — writer turns each candidate into a full post file. Skipped if the
      # researcher found nothing new (so no empty PR is opened).
      - name: Write posts
        if: ${{ steps.count.outputs.n != '0' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat .github/scripts/blog-funding-write-prompt.md)" \
            --model "${{ github.event.inputs.write_model || 'sonnet' }}" \
            --output-format json \
            --dangerously-skip-permissions \
            --max-turns 60 | tee /tmp/write_out.json >/dev/null
          echo "===== WRITE USAGE ====="
          jq -r '"input=\(.usage.input_tokens // 0) output=\(.usage.output_tokens // 0) cost_usd=\(.total_cost_usd // 0) turns=\(.num_turns // 0)"' /tmp/write_out.json 2>/dev/null || echo "(usage not parseable)"
          echo "new/changed blog files:"; git status --porcelain content/blog | sed 's/^/  /'

      # PASS 3 — HTTP-verify each drafted post's cited source and DELETE any whose
      # source is dead (404/410/unreachable) so a fabricated citation never ships.
      # Bot-blocks (401/403/429) and transient 5xx are kept. Composes the PR body.
      - name: Verify sources + drop bad posts
        id: verify
        if: ${{ steps.count.outputs.n != '0' }}
        run: |
          node .github/scripts/verify-blog.mjs
          kept=$(git ls-files --others --exclude-standard -- content/blog | grep -c '\.md$' || true)
          echo "kept=$kept" >> "$GITHUB_OUTPUT"
          echo "posts surviving verification: $kept"
          {
            echo "Automated drafts from \`blog-funding.yml\` — one per AI funding round the curator captured that had no blog page yet, enriched from sources and written in Wortins' voice. Every cited source was HTTP-verified below."
            echo ""
            cat /tmp/verify-blog.md 2>/dev/null || true
            echo ""
            echo "**Review before merging:** spot-check amounts, valuations, and investors against the cited source. Merging deploys them live."
          } > /tmp/pr-body.md

      - name: Commit + deploy (push to main)
        if: ${{ steps.verify.outputs.kept != '0' && steps.verify.outputs.kept != '' }}
        run: |
          git config user.name "wortins-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/blog/
          git commit -m "Blog: auto-published ${{ steps.verify.outputs.kept }} funding deep-dive(s)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && { echo "pushed"; break; }
            echo "push race, retrying ($i)"; sleep 5
          done

      # Ping IndexNow with the freshly published post URLs so Bing/Yandex/etc.
      # crawl them fast — the sooner they're indexed, the sooner they get cited.
      - name: Notify IndexNow
        if: ${{ steps.verify.outputs.kept != '0' && steps.verify.outputs.kept != '' }}
        run: |
          urls=$(git diff-tree --no-commit-id --name-only -r HEAD -- content/blog | grep '\.md$' \
            | sed 's#^content/blog/#https://www.wortins.com/blog/#; s#\.md$##')
          list=$(printf '%s\n' $urls https://www.wortins.com/blog | jq -R . | jq -s -c 'unique')
          echo "submitting: $list"
          curl -s -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json" \
            -d "{\"host\":\"www.wortins.com\",\"key\":\"a3d9f17c4b2e84605f1a9c7e2b6d0834\",\"keyLocation\":\"https://www.wortins.com/a3d9f17c4b2e84605f1a9c7e2b6d0834.txt\",\"urlList\":$list}" \
            -o /tmp/indexnow.txt -w "IndexNow HTTP %{http_code}\n"; cat /tmp/indexnow.txt || true
