name: Daily edition

# Only ONE curator run at a time. If two triggers ever overlap (GitHub's own cron
# and an external cron-job.org poke), the second QUEUES behind the first and then
# no-ops via the drop-guard — instead of running a second expensive curation in
# parallel and double-spending the Claude limit.
concurrency:
  group: daily-edition
  cancel-in-progress: false

on:
  # SOLE trigger: cron-job.org pings this workflow via the GitHub API at
  # 7:00 AM / 1:00 PM / 6:00 PM IST (plus manual runs). GitHub's own `schedule:`
  # cron was REMOVED because it silently dropped scheduled runs; cron-job.org
  # fires reliably, and the drop-guard below still dedupes any accidental double.
  workflow_dispatch:
    inputs:
      selftest:
        description: "Run a Supabase write self-test instead of curating"
        type: boolean
        default: false
      target_date:
        description: "Curate for a specific date (YYYY-MM-DD); blank = today (UTC)"
        type: string
        default: ""
      force:
        description: "Force a curate run even if a drop happened recently (on-demand refresh)"
        type: boolean
        default: false
      skip_articles:
        description: "Skip the Articles section this run (cron-job.org sets true for the 1 PM drop)"
        type: boolean
        default: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Supabase write self-test
        if: ${{ github.event.inputs.selftest == 'true' }}
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/items" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '[{"section":"daily","title":"__selftest__","edition_date":"2099-01-01","is_active":false,"rank":9999,"tags":[]}]')
          echo "INSERT HTTP $code"; cat /tmp/r.txt || true
          curl -s -X DELETE "$SUPABASE_URL/rest/v1/items?edition_date=eq.2099-01-01" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" >/dev/null
          echo "cleanup done"
          if [ "$code" = "201" ]; then echo "WRITE OK (service_role key works)"; else echo "WRITE FAILED — key is not service_role (got $code)"; exit 1; fi

      - name: Skip if a drop happened recently
        id: check
        if: ${{ github.event.inputs.selftest != 'true' }}
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DATE: ${{ github.event.inputs.target_date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "recent=false" >> "$GITHUB_OUTPUT"; echo "force=true -> on-demand curate"; exit 0
          fi
          DAY="${EDITION_DATE:-$(date -u +%F)}"
          # A Supabase blip returns an error OBJECT instead of a list, which
          # used to crash jq and take the whole curation down with it
          # (2026-09-12 07:00, the morning edition never ran). The guard is
          # only a dedupe: when in doubt, curate.
          latest=$(curl -s --max-time 20 "$SUPABASE_URL/rest/v1/items?select=created_at&edition_date=eq.$DAY&order=created_at.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            | jq -r 'if type == "array" then (.[0].created_at // empty) else empty end' 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "recent=false" >> "$GITHUB_OUTPUT"; echo "no items yet for $DAY -> will add a drop"
          else
            age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
            if [ "$age" -ge 3600 ]; then
              echo "recent=false" >> "$GITHUB_OUTPUT"; echo "last drop ${age}s ago (>=60m) -> will add a fresh drop"
            else
              echo "recent=true" >> "$GITHUB_OUTPUT"; echo "last drop ${age}s ago (<60m) -> skipping (recent drop)"
            fi
          fi

      # WHAT WINDOW TO SCRAPE. Every run used to gather "roughly the last 24
      # hours", so the midday and evening runs re-trawled ground the morning run
      # had already taken: the same stories kept resurfacing and the feed read as
      # yesterday's news. Each run should only cover what happened SINCE THE LAST
      # DROP.
      #
      # Derived from the data, not from the clock, so it is self-healing: the
      # window is measured back from the newest item actually published. If a run
      # is missed, the next one automatically covers the gap; if a run fires
      # early, it just gets a short window.
      #
      # OVERLAP_H re-covers the boundary so a story published moments before the
      # last drop, or indexed late by a search engine, is not lost between runs.
      # The owner's tolerance for this is "+/- 2-3 hours".
      # MAX_H caps the lookback so recovering from a long outage doesn't ask for
      # a fortnight of news in one run.
      - name: Compute the gather window
        id: window
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          OVERLAP_H=2
          MAX_H=24
          now_s=$(date -u +%s)
          floor_s=$(( now_s - MAX_H * 3600 ))
          last=$(curl -s "$SUPABASE_URL/rest/v1/items?select=published_at&is_active=eq.true&section=eq.daily&order=published_at.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" | jq -r '.[0].published_at // empty')
          if [ -z "$last" ]; then
            since_s=$floor_s
            echo "no previous daily item -> falling back to a ${MAX_H}h window"
          else
            last_s=$(date -u -d "$last" +%s)
            since_s=$(( last_s - OVERLAP_H * 3600 ))
            if [ "$since_s" -lt "$floor_s" ]; then
              since_s=$floor_s
              echo "last drop was long ago ($last) -> clamping to ${MAX_H}h"
            fi
          fi
          since=$(date -u -d "@$since_s" +%Y-%m-%dT%H:%M:%SZ)
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "gather window: $since -> now (last daily item was ${last:-none})"

      # Discovery moved OUT of the model. See fetch-feeds.mjs for the measurement,
      # but the short version: WebFetch is hard-blocked from theverge.com,
      # arstechnica.com, wired.com and theguardian.com, and Bloomberg/Reuters/NYT
      # 403 bots - so the model could not reach most of its own source list and
      # fell back to WebSearch, which returns SEO "AI roundup" farms. Plain curl
      # reaches all of them. Ingesting here means the model CHOOSES from a pool
      # instead of having to find one, which removes the farm class outright.
      # Never fails the run: on a feed outage the gather pass can still search.
      - name: Fetch candidate feeds
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        continue-on-error: true
        env:
          GATHER_SINCE: ${{ steps.window.outputs.since }}
        run: node .github/scripts/fetch-feeds.mjs

      - name: Install Claude Code
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      # PASS 1 — Haiku GATHERS: searches + fetches the day's candidate stories and
      # writes /tmp/candidates.json. This is the token-heavy scraping, so it runs
      # on cheap Haiku. No selection, no writing, no inserts.
      - name: Gather candidates (Haiku)
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DATE: ${{ github.event.inputs.target_date }}
          # cron-job.org's midday job sets skip_articles=true so that run skips Articles.
          SKIP_ARTICLES: ${{ github.event.inputs.skip_articles }}
          # Only gather `daily` stories published after this instant. Tools and
          # funding keep their own longer windows - a funding round is still news
          # three days after the press release, a daily story is not.
          GATHER_SINCE: ${{ steps.window.outputs.since }}
        run: |
          claude -p "$(cat .github/scripts/gather-prompt.md)" \
            --model haiku \
            --output-format json \
            --dangerously-skip-permissions \
            --max-turns 80 | tee /tmp/gather_out.json >/dev/null
          echo "===== GATHER (Haiku) USAGE ====="
          jq -r '"input_tokens=\(.usage.input_tokens // 0)  output_tokens=\(.usage.output_tokens // 0)  cache_read=\(.usage.cache_read_input_tokens // 0)  total_cost_usd=\(.total_cost_usd // 0)  turns=\(.num_turns // 0)  duration_ms=\(.duration_ms // 0)"' /tmp/gather_out.json 2>/dev/null || echo "(usage not parseable)"
          echo "candidates gathered: $(jq 'length' /tmp/candidates.json 2>/dev/null || echo '?')"

      # PASS 2 — Opus WRITES: reads /tmp/candidates.json, selects the best, writes
      # the 2-3 paragraph takes, and inserts. This is the small, intelligent part,
      # so it runs on Opus for quality (measured at ~$0.17/run).
      - name: Write + insert (Opus)
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DATE: ${{ github.event.inputs.target_date }}
        run: |
          claude -p "$(cat .github/scripts/write-prompt.md)" \
            --model opus \
            --output-format json \
            --dangerously-skip-permissions \
            --max-turns 40 | tee /tmp/write_out.json >/dev/null
          echo "===== WRITE (Opus) USAGE ====="
          jq -r '"input_tokens=\(.usage.input_tokens // 0)  output_tokens=\(.usage.output_tokens // 0)  cache_read=\(.usage.cache_read_input_tokens // 0)  total_cost_usd=\(.total_cost_usd // 0)  turns=\(.num_turns // 0)  duration_ms=\(.duration_ms // 0)"' /tmp/write_out.json 2>/dev/null || echo "(usage not parseable)"

      # Guard: HTTP-check every image + source link on the fresh drop and drop
      # anything dead (fabricated/404). No LLM, ~free. Runs regardless of model.
      # Deterministic taste enforcement — outlet caps + banned infra beat.
      # The prompt states these rules but the model drifts; this cannot.
      - name: Taste gate (outlet caps + banned beat)
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node .github/scripts/taste-gate.mjs

      - name: Verify images + links
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EDITION_DATE: ${{ github.event.inputs.target_date }}
        run: node .github/scripts/verify-content.mjs

      # Auto-notify search engines (Bing, Yandex, Seznam, Naver) of the fresh URLs
      # so indexing happens without manual submission. Update HOST when a custom
      # domain is connected.
      - name: Notify IndexNow
        if: ${{ github.event.inputs.selftest != 'true' && steps.check.outputs.recent != 'true' }}
        env:
          EDITION_DATE: ${{ github.event.inputs.target_date }}
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DAY="${EDITION_DATE:-$(date -u +%F)}"
          HOST="www.wortins.com"
          KEY="a3d9f17c4b2e84605f1a9c7e2b6d0834"
          # The fresh STORY pages are the URLs worth instant-indexing (IndexNow
          # feeds Bing/Copilot directly); add the live feed surfaces on top.
          STORIES=$(curl -s "$SUPABASE_URL/rest/v1/items?select=slug&edition_date=eq.$DAY&is_active=eq.true&order=published_at.desc&limit=40" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            | jq -r '.[].slug' | sed "s|^|https://$HOST/story/|" )
          printf '%s\n' "https://$HOST/" "https://$HOST/daily-ai" "https://$HOST/new-tools" "https://$HOST/articles" "https://$HOST/funding" "https://$HOST/edition/$DAY" "https://$HOST/news-sitemap.xml" $STORIES \
            | jq -R . | jq -s "{host:\"$HOST\",key:\"$KEY\",keyLocation:\"https://$HOST/$KEY.txt\",urlList:.}" > /tmp/indexnow-body.json
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/indexnow-body.json \
            -o /tmp/indexnow.txt -w "IndexNow HTTP %{http_code} ($(jq '.urlList | length' /tmp/indexnow-body.json) urls)\n"; cat /tmp/indexnow.txt || true
