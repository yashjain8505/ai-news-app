name: Daily newsletter

on:
  schedule:
    # 02:00 UTC = 07:30 IST — after the first morning curate drop (00:30 UTC),
    # so the email carries the day's fresh stories. The script is idempotent per
    # edition_date (newsletter_sends ledger), so a re-run never double-mails.
    - cron: "0 2 * * *"
    # Catch-up pass. On 2026-09-08 the primary run fired before the curator had
    # published that day's edition, so the sender resolved "latest" to the
    # PREVIOUS day, found it already sent, skipped, and exited 0 - subscribers
    # got nothing and nothing alarmed. This second pass mails the day's edition
    # if the first one missed it; the newsletter_sends ledger makes a
    # double-send impossible, so a redundant run is free.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + count recipients, send nothing"
        type: boolean
        default: false
      force:
        description: "Send even if this edition was already sent"
        type: boolean
        default: false
      edition_date:
        description: "Send a specific edition (YYYY-MM-DD); blank = latest"
        type: string
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rewrites the edition's curator headlines into plain English
      # (items.plain_title / plain_line) so the mail reads like a person wrote
      # it rather than a press release. Runs BEFORE the send so today's mail
      # carries the plain version. Both continue-on-error and the script's own
      # exit-0 guarantee are deliberate: a missing CLI, a Claude hiccup or bad
      # JSON must never hold up the newsletter, and every surface already falls
      # back to the original title/summary when a plain field is null.
      - name: Simplify the edition into plain English
        continue-on-error: true
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          # Honour a dry-run dispatch: rewriting is a DB write, so a "send
          # nothing" run should not quietly mutate the edition either.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          npm install -g @anthropic-ai/claude-code || echo "claude CLI unavailable; the pass will skip and titles stay as they are"
          node .github/scripts/simplify-edition.mjs

      - name: Send the Wortins Daily
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_KEY }}
          SITE_URL: https://www.wortins.com
          MAIL_FROM: "Wortins Daily <daily@wortins.com>"
          MAIL_REPLY_TO: hello@wortins.com
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: node .github/scripts/send-newsletter.mjs

      # Hand off the same edition to Substack: builds the post and emails it
      # ready to paste (title + formatted body + a link to /compose, whose Copy
      # button puts rich HTML on the clipboard). Idempotent per edition via the
      # substack_drafts ledger. continue-on-error: a Substack hand-off hiccup
      # must never mark the newsletter job failed, since the mail already went.
      - name: Hand off the edition to Substack (copy-paste ready)
        continue-on-error: true
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_KEY }}
          SITE_URL: https://www.wortins.com
          MAIL_FROM: "Wortins <daily@wortins.com>"
          SUBSTACK_DRAFT_TO: earanyash@gmail.com
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: node .github/scripts/send-substack-draft.mjs

      # Substack Notes, the one part of Substack CI can actually reach. Typefully
      # is an official Substack integration, so it sidesteps the Cloudflare wall
      # that blocks the internal API from datacenter IPs. Defaults to creating a
      # DRAFT (NOTES_MODE=draft): nothing goes public unreviewed and it costs
      # none of the monthly publishing quota. No-ops cleanly until the
      # TYPEFULLY_API_KEY secret exists and Substack is connected in Typefully.
      - name: Draft a Substack Note (via Typefully)
        continue-on-error: true
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          SITE_URL: https://www.wortins.com
          NOTES_MODE: draft
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node .github/scripts/substack-note.mjs

      # A missed day must be impossible to ignore. By the catch-up pass there is
      # no excuse for today's edition to be unsent, so fail and let GitHub mail
      # the owner. (The freshness watchdog below only proves items EXIST; it
      # cannot tell whether the newsletter actually went out.)
      - name: Assert today's newsletter actually went out
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 8 * * *' }}
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          today=$(date -u +%F)
          rows=$(curl -s "$SUPABASE_URL/rest/v1/newsletter_sends?edition_date=eq.$today&select=edition_date,recipients" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          echo "newsletter_sends for $today: $rows"
          if [ "$rows" = "[]" ]; then
            echo "::error::NEWSLETTER MISSED $today: no send recorded. The curator was likely late, so the sender resolved to an older edition and skipped."
            exit 1
          fi

      # Pipeline heartbeat: this job runs every morning right after the 7:00 IST
      # curate slot, so if the newest item is >12h old the curator is dead
      # (broken workflow, dead cron-job.org trigger, expired PAT, ...). Failing
      # HERE makes GitHub email the owner the same morning — the Sep 2026
      # outage ran 39 hours purely because nothing was watching. Runs after the
      # send step so a stale feed never blocks the newsletter itself.
      - name: Freshness watchdog (fail loudly if the curator is stale)
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          newest=$(curl -s "$SUPABASE_URL/rest/v1/items?select=published_at&is_active=eq.true&order=published_at.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" | jq -r '.[0].published_at // empty')
          [ -z "$newest" ] && { echo "::error::No active items at all"; exit 1; }
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$newest" +%s) ) / 3600 ))
          echo "newest item: $newest (${age_h}h old)"
          if [ "$age_h" -gt 12 ]; then
            echo "::error::CURATOR STALE: newest item is ${age_h}h old (>12h). Check daily-edition.yml dispatches + the cron-job.org trigger."
            exit 1
          fi
