name: Opus cost test (one-off)

# Measures the cost of ONLY the Opus "writing" pass of a two-pass curator:
# Haiku's scraping is already done (today's edition exists), so this hands the
# already-gathered stories to Opus and asks it to write the 2-3 paragraph takes,
# then prints the exact token usage + $ cost. Manual-only; delete after testing.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many daily stories to write takes for"
        type: string
        default: "12"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Opus writing pass + usage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: https://zrjbzowohsgjbrhsldfi.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          N: ${{ github.event.inputs.count }}
        run: |
          DAY=$(date -u +%F)
          # Pull today's already-scraped daily stories (the material Haiku gathered).
          curl -s "$SUPABASE_URL/rest/v1/items?is_active=eq.true&edition_date=eq.$DAY&section=eq.daily&select=title,source,url,summary&order=rank.asc&limit=${N:-12}" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" > items.json
          echo "Stories fetched: $(jq 'length' items.json)"
          # Build the Opus writing prompt from the gathered material.
          jq -r '"You are the writer for Wortins, a daily AI-news briefing. Below are today'\''s curated AI stories, already selected and scraped. For EACH story, write a 2 to 3 paragraph original summary in Wortins'\'' voice: what the story actually covers, the key context, and why it matters, so a reader can decide before clicking through. Your own words only, never copied, no em dashes, no fabrication. Number each.\n\n" + ([.[] | "- \(.title) (\(.source // "?")) \(.url // "")\n  Notes: \(.summary // "")"] | join("\n\n"))' items.json > prompt.txt
          echo "Prompt chars: $(wc -c < prompt.txt)"
          echo "===== running Opus writing pass ====="
          claude -p "$(cat prompt.txt)" \
            --model opus \
            --output-format json \
            --dangerously-skip-permissions \
            --max-turns 3 | tee out.json >/dev/null
          echo ""
          echo "===== OPUS WRITING PASS USAGE ====="
          jq -r '"model=\(.model // "?")\ninput_tokens=\(.usage.input_tokens // 0)\noutput_tokens=\(.usage.output_tokens // 0)\ncache_read=\(.usage.cache_read_input_tokens // 0)\ncache_creation=\(.usage.cache_creation_input_tokens // 0)\ntotal_cost_usd=\(.total_cost_usd // 0)\nturns=\(.num_turns // 0)\nduration_ms=\(.duration_ms // 0)"' out.json 2>/dev/null || cat out.json
          echo ""
          echo "===== SAMPLE OUTPUT (first 1400 chars) ====="
          jq -r '.result // ""' out.json 2>/dev/null | head -c 1400
